<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found | Raphaël Levy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .not-found-root {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }

    .not-found-card {
      width: 100%;
      max-width: 640px;
      text-align: center;
      animation: fade-in 480ms ease-out both;
    }

    .not-found-avatar {
      width: 92px;
      height: 92px;
      border-radius: 24px;
      margin: 0 auto 24px;
      border: 1px solid var(--jet);
      box-shadow: var(--shadow-2);
      object-fit: cover;
    }

    .not-found-title {
      color: var(--white-2);
      font-size: clamp(32px, 6vw, 54px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
    }

    .not-found-subtext {
      color: var(--light-gray-70);
      font-size: clamp(15px, 2.2vw, 17px);
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .not-found-divider {
      width: 84px;
      height: 1px;
      margin: 0 auto 28px;
      background: linear-gradient(to right, transparent, var(--vegas-gold), transparent);
    }

    .not-found-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 24px;
      border-radius: 14px;
      border: 1px solid var(--jet);
      background: var(--border-gradient-onyx);
      color: var(--white-2);
      font-weight: var(--fw-500);
      transition: transform var(--transition-1), box-shadow var(--transition-1), border-color var(--transition-1);
    }

    .not-found-cta:hover {
      transform: translateY(-2px);
      border-color: var(--vegas-gold);
      box-shadow: var(--shadow-2);
    }

    .not-found-footer {
      margin-top: 20px;
      color: var(--light-gray-70);
      font-size: 12px;
      letter-spacing: 0.02em;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <main class="not-found-root">
    <section class="not-found-card" aria-labelledby="not-found-title">
      <img class="not-found-avatar" src="/assets/images/my-avatar.png" alt="Raphaël Levy">
      <h1 id="not-found-title" class="not-found-title">Page not found.</h1>
      <p class="not-found-subtext">This page may have been removed or no longer exists.</p>
      <div class="not-found-divider" aria-hidden="true"></div>
      <a class="not-found-cta" href="/">Back to homepage</a>
      <p class="not-found-footer">Building Digital Ventures | Raphaël Levy</p>
    </section>
  </main>
</body>
</html>
